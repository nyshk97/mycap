name: mycap
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
targets:
  mycap:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Sparkle
      - sdk: Carbon.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: Vision.framework
    # 署名を安定させないとリビルドのたびに画面収録の許可が飛ぶため、
    # CODE_SIGN_IDENTITY は証明書ハッシュで固定する。ハッシュはマシンごとに異なるので
    # scripts/gen-signing-xcconfig.sh（mise run signing）が keychain から検出して書き出す（gitignore 対象）。
    # xcconfig が無ければ scripts/ensure-signing-xcconfig.sh が ad-hoc 署名の xcconfig を置く。
    configFiles:
      Debug: signing-debug.local.xcconfig
      Release: signing-release.local.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        # 開発用（Apple Development）の個人 Team。配布用の Developer ID Application の Team は VYDUR99LAM で別物
        # （scripts の TEAM_ID はそちら）。取り違えではないので揃えない（personal-mac-apps.md の署名の節）
        DEVELOPMENT_TEAM: U4WAHGGBR7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # scripts/make-release-zip.sh の再署名でも同じファイルを渡す
        CODE_SIGN_ENTITLEMENTS: mycap.entitlements
      configs:
        # dev と常用は Bundle ID を分離する（TCC 権限・データ・Sparkle が独立し、併存しても衝突しない）
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.nyshk97.mycap.dev
          PRODUCT_NAME: mycap Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.nyshk97.mycap
          PRODUCT_NAME: mycap
          # feed は Release だけ。dev 版に入れると更新チェックで常用版のビルドに置き換わる
          MYCAP_SU_FEED_URL: https://github.com/nyshk97/mycap/releases/latest/download/appcast.xml
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # 素の xcodebuild build が get-task-allow を注入して notarize が Invalid になるのを防ぐ
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        CFBundleAllowMixedLocalizations: true
        # Sparkle は CFBundleVersion で新旧比較する。MARKETING_VERSION に連動させ bump 忘れを防ぐ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
        # Sparkle。アップデータの起動は #if !DEBUG でガードし、feed URL も Release 構成にだけ
        # 入れる二重防御（Debug では MYCAP_SU_FEED_URL が未定義で空文字になる）
        SUFeedURL: $(MYCAP_SU_FEED_URL)
        SUEnableAutomaticChecks: true
        # keychain の Sparkle 鍵（account "mycap"）と対。generate_keys --account mycap の出力を書く
        SUPublicEDKey: Xal3F2sjXCGemM1fMW0ifL5K22ec+oQZWrdY/Z42Vdg=
  mycapTests:
    type: bundle.unit-test
    platform: macOS
    # アプリをホストにせず、純粋関数（Sources/Core）だけを直接コンパイルしてテストする。
    # ホストにすると常駐アプリが起動してホットキーやクリップボード監視まで走る
    sources:
      - Sources/Core
      - Tests
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nyshk97.mycap.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  mycap:
    build:
      targets:
        mycap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - mycapTests
